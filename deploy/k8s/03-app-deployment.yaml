apiVersion: apps/v1
kind: Deployment
metadata:
  name: vas-cloud-app
  namespace: vas-cloud
spec:
  replicas: 2 # sessions are stored in the vas_portal database (portal_sessions), so any replica can serve any request.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # never drop below 2 ready pods during a rollout
  selector:
    matchLabels:
      app: vas-cloud-app
  template:
    metadata:
      labels:
        app: vas-cloud-app
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/ous39/vas-cloud-app:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: vas-cloud-app-config
            - secretRef:
                name: vas-cloud-app-secret
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: vas-cloud-app
  namespace: vas-cloud
spec:
  selector:
    app: vas-cloud-app
  ports:
    - port: 80
      targetPort: 80
