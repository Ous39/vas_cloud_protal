apiVersion: apps/v1
kind: Deployment
metadata:
  name: vas-cloud-app
  namespace: vas-cloud
spec:
  replicas: 2 # sessions are stored in the vas_portal database (portal_sessions), so any replica can serve any request.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # never drop below 2 ready pods during a rollout
  selector:
    matchLabels:
      app: vas-cloud-app
  template:
    metadata:
      labels:
        app: vas-cloud-app
    spec:
      # The cluster's DNS cannot resolve the Hera test host (it resolves from the office network), so USSD purchases
      # to https://vas-testing.comium.gm/hera/... name its address here. Same address as vas-prod.comium.gm: the ingress.
      hostAliases:
        - ip: "192.168.164.150"
          hostnames:
            - vas-testing.comium.gm
            - vas-prod.comium.gm # Hera's live Balance / Status look-up (flow check_balance); the same ingress address
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/ous39/vas-cloud-app:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: vas-cloud-app-config
            - secretRef:
                name: vas-cloud-app-secret
          # /health.php answers 200 only while the portal's database is reachable (no login, no redirect)
          readinessProbe:
            httpGet: { path: /health.php, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: "/health.php?live=1", port: 80 }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: vas-cloud-app
  namespace: vas-cloud
spec:
  selector:
    app: vas-cloud-app
  ports:
    - port: 80
      targetPort: 80
---
# Keeps at least one portal pod up while a node is drained (the portal serves live USSD menus).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vas-cloud-app
  namespace: vas-cloud
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vas-cloud-app
