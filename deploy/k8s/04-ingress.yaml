# Served under /portal (not the bare host) because vas-prod.comium.gm is shared with other
# services. The regex path + rewrite-target strips /portal before forwarding to the app, which
# knows nothing about the prefix; the configuration-snippet redirects the bare "/portal" (no
# trailing slash) to "/portal/" so the app's relative asset links (style.css, ?page=...) resolve
# correctly — without it, a browser at exactly "/portal" resolves "style.css" against "/" and 404s.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vas-cloud-app
  namespace: vas-cloud
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "vas-cloud-affinity"
    nginx.ingress.kubernetes.io/session-cookie-expires: "3600"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri = "/portal") {
        return 301 /portal/;
      }
    # Uncomment once cert-manager (or Rancher's built-in one) is set up for automatic HTTPS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: vas-prod.comium.gm
      http:
        paths:
          - path: /portal(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: vas-cloud-app
                port:
                  number: 80
  # tls:
  #   - hosts: ["vas-prod.comium.gm"]
  #     secretName: vas-cloud-tls
