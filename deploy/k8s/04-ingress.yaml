# Served under /portal (not the bare host) because vas-prod.comium.gm is shared with other
# services. The regex path + rewrite-target strips /portal before forwarding to the app, which
# knows nothing about the prefix; the configuration-snippet redirects the bare "/portal" (no
# trailing slash) to "/portal/" so the app's relative asset links (style.css, ?page=...) resolve
# correctly — without it, a browser at exactly "/portal" resolves "style.css" against "/" and 404s.
#
# No session-affinity annotation here on purpose: sessions are stored in the shared MySQL database
# (DbSessionHandler in bootstrap.php), not per-pod disk, so any replica can serve any request. An
# earlier version pinned users to one pod via nginx's cookie affinity, which didn't hold up reliably
# combined with the regex path above — intermittent "Security token expired" logouts once running
# more than one replica.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vas-cloud-app
  namespace: vas-cloud
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri = "/portal") {
        return 301 /portal/;
      }
    # Uncomment once cert-manager (or Rancher's built-in one) is set up for automatic HTTPS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: vas-prod.comium.gm
      http:
        paths:
          - path: /portal(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: vas-cloud-app
                port:
                  number: 80
  # tls:
  #   - hosts: ["vas-prod.comium.gm"]
  #     secretName: vas-cloud-tls
