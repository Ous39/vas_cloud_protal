# Builds the app image and pushes it to GHCR on every push to master, so deploying is just
# `kubectl rollout restart` — no docker build/push from a laptop.
#
# One-time setup: the package must let this repository write to it (GitHub -> your profile ->
# Packages -> vas-cloud-app -> Package settings -> Manage Actions access -> add this repository
# with the Write role). Until then the push step fails with 403 "permission_denied".
name: Build and push image

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # GHCR requires a lowercase name; the account is Ous39 but the registry path is lowercase.
  IMAGE: ghcr.io/ous39/vas-cloud-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest is what the Kubernetes deployment pulls; the commit-SHA tag is there so a bad
      # build can be rolled back to a specific known image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
