services:
  db:
    image: mysql:8.0
    container_name: vas-enterprise-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - vas_enterprise_db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s
    networks:
      - vasnet

  app:
    build: .
    image: vas-enterprise-app:latest
    container_name: vas-enterprise-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORTAL_DB: vas_portal
      DEFAULT_SCHEMA: ${DEFAULT_SCHEMA:-HeraTesting}
      APP_TZ: ${APP_TIMEZONE:-UTC}
    ports:
      - "${APP_PORT:-8090}:80"
    networks:
      - vasnet

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: vas-enterprise-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 256M
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    networks:
      - vasnet

volumes:
  vas_enterprise_db_data:

networks:
  vasnet:
    driver: bridge
