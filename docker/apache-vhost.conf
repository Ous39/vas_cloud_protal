<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/vas_error.log
    CustomLog ${APACHE_LOG_DIR}/vas_access.log combined
</VirtualHost>
